name: Crear PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Bajar mi codigo
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make curl

      - name: Bajar OpenOrbis (herramienta para hacer PKG de PS4)
        run: |
          curl -sL https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest > release.json
          URL=$(grep browser_download_url release.json | grep -E '\.tar\.gz' | head -1 | cut -d '"' -f 4)
          echo "Descargando: $URL"
          test -n "$URL"
          mkdir -p $HOME/oo
          cd $HOME/oo
          curl -fL "$URL" -o oo.tar.gz
          tar -xzf oo.tar.gz
          TC=$(dirname $(find $HOME/oo -type d -name samples | head -1))
          echo "Toolchain en: $TC"
          echo "OO_PS4_TOOLCHAIN=$TC" >> $GITHUB_ENV

      - name: Preparar el proyecto con mi codigo
        run: |
          chmod +x $OO_PS4_TOOLCHAIN/bin/linux/* || true
          cp -r $OO_PS4_TOOLCHAIN/samples/hello_world $GITHUB_WORKSPACE/hello_world
          cd $GITHUB_WORKSPACE/hello_world
          rm -f hello_world/main.cpp
          cp $GITHUB_WORKSPACE/main.c hello_world/main.c
          curl -fL --retry 3 https://tweetnacl.cr.yp.to/20140427/tweetnacl.h -o hello_world/tweetnacl.h
          curl -fL --retry 3 https://tweetnacl.cr.yp.to/20140427/tweetnacl.c -o hello_world/tn.inc
          curl -fL --retry 3 https://raw.githubusercontent.com/kokke/tiny-AES-c/master/aes.h -o hello_world/aes.h
          curl -fL --retry 3 https://raw.githubusercontent.com/kokke/tiny-AES-c/master/aes.c -o hello_world/aes.inc
          ls -la hello_world
          sed -i 's/^LIBS.*/LIBS := -lc -lkernel -lSceNet -lSceNetCtl -lSceSysmodule/' Makefile
          sed -i 's/Hello World/Ronixz Cast/g; s/HELLOWORLD/RONIXZCAST/g; s/BREW00085/RCST00001/g' Makefile
          cp $GITHUB_WORKSPACE/IMG_6558.png sce_sys/icon0.png
          echo "===== Makefile ====="
          cat Makefile

      - name: Compilar
        run: |
          cd $GITHUB_WORKSPACE/hello_world
          make

      - name: Guardar el PKG
        uses: actions/upload-artifact@v4
        with:
          name: ronixz-cast-pkg
          path: hello_world/*.pkg
          if-no-files-found: error
