name: Crear PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Bajar mi codigo
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make curl

      - name: Bajar OpenOrbis (herramienta para hacer PKG de PS4)
        run: |
          curl -sL https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest > release.json
          grep browser_download_url release.json || true
          URL=$(grep browser_download_url release.json | grep -E '\.tar\.gz' | head -1 | cut -d '"' -f 4)
          echo "Descargando: $URL"
          test -n "$URL"
          mkdir -p $HOME/oo
          cd $HOME/oo
          curl -fL "$URL" -o oo.tar.gz
          tar -xzf oo.tar.gz
          TC=$(dirname $(find $HOME/oo -type d -name samples | head -1))
          echo "Toolchain en: $TC"
          ls $TC
          echo "OO_PS4_TOOLCHAIN=$TC" >> $GITHUB_ENV

      - name: Preparar el proyecto con mi main.c
        run: |
          chmod +x $OO_PS4_TOOLCHAIN/bin/linux/* || true
          cp -r $OO_PS4_TOOLCHAIN/samples/hello_world $GITHUB_WORKSPACE/app
          cp $GITHUB_WORKSPACE/main.c $GITHUB_WORKSPACE/app/src/main.c
          sed -i 's/^LIBS.*/LIBS := -lc -lkernel -lSceNet -lSceNetCtl -lSceSysmodule/' $GITHUB_WORKSPACE/app/Makefile
          grep -n "LIBS" $GITHUB_WORKSPACE/app/Makefile || true

      - name: Compilar
        run: |
          cd $GITHUB_WORKSPACE/app
          make

      - name: Guardar el PKG
        uses: actions/upload-artifact@v4
        with:
          name: ronixz-cast-pkg
          path: app/*.pkg
          if-no-files-found: error
